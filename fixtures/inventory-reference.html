<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inventory Manager</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#f2f5f8;color:#17202b}
 header{background:#173a5e;color:#fff;padding:14px 20px}
 main{max-width:820px;margin:16px auto;padding:0 12px}
 form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;margin-bottom:12px}
 input,select,button{padding:8px;border:1px solid #c6cfda;border-radius:6px;font-size:14px}
 button{cursor:pointer;background:#1f6feb;color:#fff;border:none}
 button.ghost{background:#e3e9f0;color:#17202b}
 button.del{background:#fdecec;color:#a12622;border:none;padding:4px 8px}
 table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden}
 th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #e6ebf1}
 .toolbar{display:flex;gap:8px;margin:12px 0}
 .cards{display:flex;gap:14px;margin:12px 0}
 .card{flex:1;background:#fff;border-radius:8px;padding:10px 14px;border:1px solid #dfe6ee}
 .card b{display:block;font-size:20px}
 #stOut{font-family:ui-monospace,monospace;font-size:13px;white-space:pre-wrap}
</style>
</head>
<body>
<header><h1 style="margin:0;font-size:20px">Inventory Manager</h1></header>
<main>
  <div class="cards">
    <div class="card">TOTAL PRODUCTS <b id="dCount">0</b></div>
    <div class="card">INVENTORY VALUE <b id="dValue">$0</b></div>
    <div class="card">LOW STOCK (&lt;5) <b id="dLow">0</b></div>
  </div>
  <form id="addForm">
    <input id="fName" placeholder="Product name" required>
    <select id="fCat"><option>Food</option><option>Travel</option><option>Office</option></select>
    <input id="fQty" type="number" placeholder="Qty" required>
    <input id="fPrice" type="number" step="0.01" placeholder="Price" required>
    <button type="submit">Add Product</button>
  </form>
  <div class="toolbar">
    <select id="filterCat"><option value="">All categories</option>
      <option>Food</option><option>Travel</option><option>Office</option></select>
    <input id="searchBox" placeholder="Search name…">
    <button class="ghost" id="selfTestBtn" onclick="runSelfTest()">🧪 Run Self-Tests</button>
  </div>
  <table><thead><tr><th>Name</th><th>Category</th><th>Qty</th><th>Price</th><th></th></tr></thead>
    <tbody id="rows"></tbody></table>
  <div id="selfTest" style="background:#fff;border:1px solid #dfe6ee;border-radius:8px;padding:12px;margin-top:14px">
    <b>Self-Test Panel</b> <div id="stOut">not run</div>
  </div>
</main>
<script>
const KEY = "inventory.v1";
let db = load();

/* ---- embedded data store: CRUD + query, persisted to localStorage ---- */
const store = {
  getAll(){ return db.slice(); },
  query(pred){ return db.filter(pred); },
  add(p){ p.id = Date.now() + Math.floor(Math.random()*1000); db.push(p); store.persist(); return p; },
  update(id, patch){ const it = db.find(x => x.id === id);
    if (it) Object.assign(it, patch); store.persist(); return it; },
  remove(id){ db = db.filter(x => x.id !== id); store.persist(); },
  persist(){ localStorage.setItem(KEY, JSON.stringify(db)); },
};
function load(){
  try { const v = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(v) && v.length) return v; }
  catch(e){}
  return seed();
}
function seed(){
  const cats = ["Food","Travel","Office"];
  const out = []; let id = 1;
  const names = ["Rice bag","Pasta pack","Energy drink","Flight voucher","Taxi card","Hotel mug",
                 "Notebook","USB hub","Stapler","Coffee beans","Tea box","Marker set"];
  names.forEach((n,i) => out.push({ id: id++, name: n,
    cat: cats[i % 3], qty: (i*3)%14 + 1, price: ((i*7)%40) + 3.5 }));
  return out;
}

/* ---- app functions used by the self-test ---- */
function addProduct(name, cat, qty, price){ return store.add({name, cat, qty: +qty, price: +price}); }
function removeProduct(id){ store.remove(id); render(); }
function totalValue(list){ return list.reduce((a,p) => a + p.qty * p.price, 0); }
function lowStock(list){ return list.filter(p => p.qty < 5).length; }

function render(){
  const cat = document.getElementById("filterCat").value;
  const q = document.getElementById("searchBox").value.toLowerCase();
  let list = cat ? store.query(p => p.cat === cat) : store.getAll();
  if (q) list = list.filter(p => p.name.toLowerCase().includes(q));
  const rows = document.getElementById("rows");
  rows.innerHTML = list.map(p =>
    `<tr><td>${p.name}</td><td>${p.cat}</td><td>${p.qty}</td><td>$${p.price.toFixed(2)}</td>` +
    `<td><button class="del" data-id="${p.id}">✕</button></td></tr>`).join("");
  document.getElementById("dCount").textContent = store.getAll().length;
  document.getElementById("dValue").textContent = "$" + totalValue(store.getAll()).toFixed(2);
  document.getElementById("dLow").textContent = lowStock(store.getAll());
}
document.getElementById("rows").addEventListener("click", e => {
  const b = e.target.closest("button.del");
  if (b) removeProduct(+b.dataset.id);
});
document.getElementById("addForm").addEventListener("submit", e => {
  e.preventDefault();
  addProduct(fName.value, fCat.value, fQty.value, fPrice.value);
  e.target.reset();
});
document.getElementById("filterCat").addEventListener("change", render);
document.getElementById("searchBox").addEventListener("input", render);

/* ---- self-test: do not modify ---- */
function runSelfTest(){
  const out = [];
  const mark = (ok, name) => out.push((ok ? "✓ " : "✗ ") + name);
  const probe = addProduct("ZZ probe item", "Office", 2, 9.5);
  try {
    mark(store.getAll().length === 13, "seed holds 12 products + probe = 13");
    const back = store.getAll().find(p => p.id === probe.id);
    mark(!!back && back.name === "ZZ probe item" && back.price === 9.5, "add + read-back");
    store.update(probe.id, { qty: 7 });
    mark(store.getAll().find(p => p.id === probe.id).qty === 7, "update quantity");
    store.remove(probe.id);
    mark(!store.getAll().some(p => p.id === probe.id), "delete removes the product");
    mark(lowStock(store.getAll()) === store.getAll().filter(p => p.qty < 5).length,
         "low-stock computation matches");
    store.persist();
    const round = JSON.parse(localStorage.getItem(KEY));
    mark(Array.isArray(round) && round.length === store.getAll().length &&
         round.every(p => p.name && p.cat !== undefined), "persistence round-trip");
    mark(store.query(p => p.cat === "Food").length === store.getAll().filter(p => p.cat === "Food").length,
         "query by category");
    mark(totalValue(store.getAll()) > 0, "total value computes");
  } catch(e) { out.push("✗ self-test crashed: " + e.message); }
  const passed = out.filter(l => l.startsWith("✓")).length;
  out.push(passed + "/" + out.length + " passed");
  document.getElementById("stOut").textContent = out.join("\n");
  render();
}
render();
</script>
</body>
</html>
